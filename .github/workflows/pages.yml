name: Deploy playable game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/wechat-preview/**'
      - 'packages/core/**'
      - 'packages/content/**'
      - 'packages/preview/**'
      - 'scripts/build-preview-core.mjs'
      - 'scripts/export-public-web.mjs'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check configured GitHub Pages site
        uses: actions/configure-pages@v5
      - name: Test game
        run: npm test
      - name: Build static playable copies
        run: |
          node scripts/build-preview-core.mjs
          node scripts/export-public-web.mjs "$RUNNER_TEMP/pages"
          node --test tests/public-web-export.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
